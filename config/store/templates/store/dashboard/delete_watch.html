
{% extends 'store/dashboard/base.html' %}

{% block content %}

<div class="max-w-xl mx-auto mt-10">

    <div class="bg-white rounded-xl shadow-sm p-8 text-center">

        <div class="text-red-500 text-5xl mb-5">
            <i class="fa-solid fa-trash-can"></i>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-3">
            Delete Watch?
        </h1>

        <p class="text-gray-500 mb-6">
            Are you sure you want to delete
            <strong class="text-gray-800">{{ watch.name }}</strong>?
            This action cannot be undone.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="flex justify-center gap-4">

                <button type="submit"
                        class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg">
                    Yes, Delete
                </button>

                <a href="{% url 'admin_products' %}"
                   class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-lg">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
