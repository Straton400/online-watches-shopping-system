
{% extends 'store/dashboard/base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Edit Watch</h1>
        <p class="text-gray-500 mt-1">
            Update information for {{ watch.name }}
        </p>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-8">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="space-y-5">

                {% for field in form %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">
                            {{ field.errors }}
                        </p>
                    {% endif %}
                </div>

                {% endfor %}

            </div>

            <div class="flex gap-4 mt-8">

                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg">
                    Save Changes
                </button>

                <a href="{% url 'admin_products' %}"
                   class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-lg">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
